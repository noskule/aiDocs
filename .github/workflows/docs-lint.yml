name: Docs Lint

# Link checking is deliberately NOT done here: template docs intentionally
# reference per-project files (development.md, testing.md, ...) that only
# exist in consuming projects. The validate-docs agent checks links
# context-aware instead.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - "docs/tools/check-docs.py"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - "docs/tools/check-docs.py"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural doc checks
        run: python docs/tools/check-docs.py
